name: SSQ Auto Analyzer Cron

on:
  schedule:
    # 北京时间周二、周四、周日晚 22:30 自动执行（UTC 时间 14:30）
    - cron: '30 14 * * 0,2,4'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run-analyzer:
    runs-on: ubuntu-latest

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 配置 Python 环境
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 安装 Python 依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 运行分析与推算程序
        run: |
          python ssq_analyzer.py

      - name: 自动提交并推送 README 报告
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action Bot"
          git add README.md
          git diff --staged --quiet || (git commit -m "Auto update SSQ trend analysis [skip ci]" && git push)
